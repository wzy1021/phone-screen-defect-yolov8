{% extends 'base.html' %}
{% block title %}数据统计{% endblock %}
{% block page_title %}数据统计{% endblock %}
{% block page_sub %}按类别、时间统计缺陷分布与检测量{% endblock %}

{% block content %}
<section class="card filter-card">
  <div class="card-body">
    <div class="filter-row">
      <div class="filter-item">
        <label>开始日期</label>
        <input type="date" id="startDate">
      </div>
      <div class="filter-item">
        <label>结束日期</label>
        <input type="date" id="endDate">
      </div>
      <button class="btn-primary-custom btn-sm" id="applyBtn">应用筛选</button>
      <button class="btn-ghost btn-sm" id="resetBtn">全部时间</button>
      <div class="quick-range">
        <button data-days="7">近 7 天</button>
        <button data-days="30">近 30 天</button>
      </div>
    </div>
  </div>
</section>

<div class="stat-grid">
  <div class="stat-card">
    <div class="stat-icon" style="--c:#2f6bff">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M3 9h18"></path></svg>
    </div>
    <div class="stat-info"><div class="stat-label">检测总数</div><div class="stat-value" id="statRecords">0</div></div>
  </div>
  <div class="stat-card">
    <div class="stat-icon" style="--c:#ff4d4f">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
    </div>
    <div class="stat-info"><div class="stat-label">缺陷总数</div><div class="stat-value" id="statDefects">0</div></div>
  </div>
  <div class="stat-card">
    <div class="stat-icon" style="--c:#52c41a">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>
    </div>
    <div class="stat-info"><div class="stat-label">今日检测</div><div class="stat-value" id="statToday">0</div></div>
  </div>
  <div class="stat-card">
    <div class="stat-icon" style="--c:#13c2c2">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2"></path><path d="M9 2h6"></path></svg>
    </div>
    <div class="stat-info"><div class="stat-label">平均耗时</div><div class="stat-value"><span id="statCost">0</span><small> ms</small></div></div>
  </div>
</div>

<div class="chart-grid">
  <section class="card">
    <div class="card-head"><h2>各缺陷类别数量</h2><span class="badge-soft">柱状图</span></div>
    <div class="card-body"><div class="chart" id="barChart"></div></div>
  </section>
  <section class="card">
    <div class="card-head"><h2>缺陷类别占比</h2><span class="badge-soft">饼图</span></div>
    <div class="card-body"><div class="chart" id="pieChart"></div></div>
  </section>
  <section class="card chart-wide">
    <div class="card-head"><h2>最近检测趋势</h2><span class="badge-soft">按天统计</span></div>
    <div class="card-body"><div class="chart chart-sm" id="trendChart"></div></div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/stats.js') }}"></script>
{% endblock %}
