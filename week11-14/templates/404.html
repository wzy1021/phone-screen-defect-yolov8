<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面不存在 · 屏幕缺陷检测</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="error-page">
    <div class="error-code">{{ code|default(500 if message else 404) }}</div>
    <h1>{% if message %}{{ message }}{% else %}页面不存在{% endif %}</h1>
    <p>{% if message %}请稍后再试，或返回检测中心继续操作。{% else %}你访问的页面可能已经被删除，或者地址输入有误。{% endif %}</p>
    <a class="btn-primary-custom" href="{{ url_for('views.detect') }}">返回检测中心</a>
  </div>
</body>
</html>
